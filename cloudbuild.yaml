# Cloud Build configuration for automatic deployment to Cloud Run
# Triggered on push to main branch
#
# Prerequisites:
# - GitHub repository connected to Cloud Build
# - Service account with permissions for Cloud Run, Cloud SQL, Artifact Registry
# - All secrets configured in Secret Manager

substitutions:
  _PROJECT_ID: educai-nova-versao-20261026
  _REGION: southamerica-east1
  _SERVICE_NAME: educai
  _REPOSITORY: educai
  _SQL_INSTANCE: educai-db
  _IMAGE_TAG: ${SHORT_SHA}
  _SMOKE_BASE_URL: https://educai.dev.br

options:
  # Use higher machine for faster builds
  machineType: E2_HIGHCPU_8
  # Enable build logs streaming
  logging: CLOUD_LOGGING_ONLY
  # Enable substitution for environment variables
  substitutionOption: ALLOW_LOOSE

steps:
  # Step 1: Verify migrations have LF line endings (required for checksum consistency)
  - name: gcr.io/cloud-builders/gcloud
    id: verify-migrations
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        echo "Verifying migration line endings..."
        for file in database/migrations/*.sql; do
          if file "$file" | grep -q CRLF; then
            echo "ERROR: Migration $file has CRLF line endings. Convert to LF."
            exit 1
          fi
        done
        echo "All migrations have LF line endings ✓"

  # Step 2: Build Docker image
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"
      - "."

  # Step 3: Push Docker image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}"
    waitFor:
      - build-image

  # Step 4: Create Cloud SQL backup before deployment
  - name: gcr.io/cloud-builders/gcloud
    id: backup-database
    args:
      - sql
      - backups
      - create
      - "--instance=${_SQL_INSTANCE}"
      - "--project=${_PROJECT_ID}"
      - "--description=pre-deploy-${SHORT_SHA}"
    waitFor:
      - push-image

  # Step 5: Update migrate job with new image
  - name: gcr.io/cloud-builders/gcloud
    id: update-migrate-job
    args:
      - run
      - jobs
      - update
      - educai-migrate
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
    waitFor:
      - backup-database

  # Step 6: Update workers job with new image
  - name: gcr.io/cloud-builders/gcloud
    id: update-workers-job
    args:
      - run
      - jobs
      - update
      - educai-workers
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
    waitFor:
      - update-migrate-job

  # Step 7: Update retention job with new image
  - name: gcr.io/cloud-builders/gcloud
    id: update-retention-job
    args:
      - run
      - jobs
      - update
      - educai-retention
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
    waitFor:
      - update-workers-job

  # Step 8: Execute database migrations
  - name: gcr.io/cloud-builders/gcloud
    id: run-migrations
    args:
      - run
      - jobs
      - execute
      - educai-migrate
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
      - "--wait"
    waitFor:
      - update-retention-job

  # Step 9: Deploy new revision to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-service
    args:
      - run
      - services
      - update
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
    waitFor:
      - run-migrations

  # Step 10: Smoke test - verify health endpoints
  - name: gcr.io/cloud-builders/curl
    id: smoke-test
    args:
      - "-f"
      - "-s"
      - "${_SMOKE_BASE_URL}/api/health/live"
    waitFor:
      - deploy-service

  # Step 11: Verify ready endpoint
  - name: gcr.io/cloud-builders/curl
    id: smoke-test-ready
    args:
      - "-f"
      - "-s"
      - "${_SMOKE_BASE_URL}/api/health/ready"
    waitFor:
      - smoke-test

# Store built image in Artifact Registry
images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"

# Build timeout: 20 minutes
timeout: 1200s
