services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: educai
      POSTGRES_USER: educai
      POSTGRES_PASSWORD: educai_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educai -d educai"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - educai_postgres_data:/var/lib/postgresql/data

volumes:
  educai_postgres_data:
